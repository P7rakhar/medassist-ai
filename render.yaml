# Render.com blueprint — free Python web service (no Docker needed).
# Render dashboard → New → Blueprint → pick this GitHub repository.
services:
  - type: web
    name: medassist-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TZ
        value: Asia/Kolkata
